# The alarms of the player, like the alarms in Amazfish. Any number of
# sections, each one alarm:
#   enabled   true or false
#   hour      0 to 23
#   minute    0 to 59
#   days      the days it goes off, any of mon tue wed thu fri sat sun;
#             without days every day
#   one_shot  true: it goes off once and turns itself off; default false
#   duration  minutes it plays, 0 is until somebody stops it; default 60
#   volume    0 to 100; without it the volume of the buttons
# panel.py rewrites this file when a one_shot alarm turns itself off,
# and then these comments are lost.

[alarm1]
enabled = false
hour = 6
minute = 30
days = mon tue wed thu fri
one_shot = false
duration = 60
